services:
  judge-agent:
    image: zerone-judge-agent:latest
    build:
      context: ..
    env_file:
      - ./env/judge-agent.env
    environment:
      JUDGE_SANDBOX_MODE: isolate
      JUDGE_CHECKER_SANDBOX_MODE: isolate
      JUDGE_SANDBOX_MEMORY_MB: "512"
      JUDGE_SANDBOX_PIDS_LIMIT: "128"
      JUDGE_OUTPUT_LIMIT_BYTES: "1048576"
    volumes:
      - /var/lib/zerone-judge:/var/lib/zerone-judge
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /run/isolate:/run/isolate:rw
    privileged: true
    pids_limit: 1024
    mem_limit: ${JUDGE_AGENT_CONTAINER_MEMORY:-20g}
    cpus: ${JUDGE_AGENT_CONTAINER_CPUS:-10}
    restart: unless-stopped
