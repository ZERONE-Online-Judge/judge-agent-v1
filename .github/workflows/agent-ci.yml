name: Judge Agent CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Build and verify the actual agent image
        run: |
          docker build -t zoj-judge-agent:ci .
          docker run --rm --network none --entrypoint docker zoj-judge-agent:ci --version
      - run: docker build -t zoj-editor-runtime:agent-v1 editor-runtime
      - run: docker build -t zoj-editor-renderer:agent-v1 -f editor-runtime/Renderer.Dockerfile editor-runtime
      - name: Verify actual Editor execution and isolation
        run: RUN_EDITOR_EXECUTOR_TESTS=1 python -m pytest -q tests/test_editor_executor.py
